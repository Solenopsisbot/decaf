name: ci

# The gates every change must pass: formatting, clippy with warnings denied,
# the Rust tests and the corpus tools' Python tests. Corpus measurements need
# jars and a Horizon build, so they run elsewhere (real-mod-corpus.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    # The full test suite now takes up to 44 minutes on hosted runners: 45 cancelled #585 twice while its
    # last test files were running, with no failure. 75 leaves headroom without hiding a real hang.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache Gson fixture library
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gson-2.14.0.jar
          key: gson-2.14.0-2cbd119bf1961c28788310963dc80ba65f58cdeec1dd139c8bdb1240faa2c36f
      - name: Prepare Gson fixture library
        env:
          GSON_URL: https://repo1.maven.org/maven2/com/google/code/gson/gson/2.14.0/gson-2.14.0.jar
          GSON_SHA256: 2cbd119bf1961c28788310963dc80ba65f58cdeec1dd139c8bdb1240faa2c36f
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/gson-2.14.0.jar" ]; then
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/gson-2.14.0.jar" "$GSON_URL"
          fi
          echo "$GSON_SHA256  $RUNNER_TEMP/gson-2.14.0.jar" | sha256sum --check --strict
          echo "HORIZON_GSON_JAR=$RUNNER_TEMP/gson-2.14.0.jar" >> "$GITHUB_ENV"
      - name: Vendored runtime
        # `mod/src/runtime/` is a copy of `crates/horizon-native-java/src` (the native mod is one
        # crate). Every PR and push must carry the copy its runtime vendors to: `--check`
        # regenerates it and compares byte for byte, which catches a hand edit to the copy and a
        # runtime change that was not re-vendored alike. Fix with `python3 tools/vendor.py`.
        run: python3 tools/vendor.py --check
      - name: Format
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo +stable test --locked
      - name: Python tests
        # The fixture tests look for the debug binaries the step above built.
        run: python3 -m unittest discover -s tests

  # `mod/` is excluded from the workspace (the launcher builds it against Sunrise's own lock), so
  # the workspace gates above never compile it. This job does, so a mod PR's green check means the
  # mod's code builds, lints clean and passes its unit tests.
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mod
      - name: Fetch the pinned Sunrise SDK
        # `mod/Cargo.toml` names the mod API by `.sunrise/sdk/` (the only form Sunrise accepts), so the
        # SDK of the build pinned in `mod/sunrise-mod.toml` is fetched before cargo runs. The tool comes
        # from that build's release and is checked against Sunrise's signed SHA256SUMS, as Sunrise's
        # install docs do (docs/modding/src/start/install-tool.md; the key is in
        # crates/sunrise-release-sign/release-keys.txt). `check --uses` then fetches and verifies the SDK.
        run: |
          set -eu
          PIN=$(sed -n 's/^sunrise = "\([0-9a-f]\{40\}\)"$/\1/p' mod/sunrise-mod.toml)
          [ -n "$PIN" ] || { echo "no [native] sunrise pin in mod/sunrise-mod.toml" >&2; exit 1; }
          BASE=https://github.com/sunrise-org/sunrise/releases/download/sdk-$PIN
          KEY=r53xb3cuafGxZSicLz06KC+xXp9NJdPH8snNmXo5pAc=
          TOOL=tool-x86_64-unknown-linux-gnu.tar.xz
          WORK=$RUNNER_TEMP/sunrise-tool
          mkdir -p "$WORK" && cd "$WORK"
          curl -fsSLO "$BASE/$TOOL"
          curl -fsSLO "$BASE/SHA256SUMS"
          curl -fsSLO "$BASE/SHA256SUMS.sig"
          printf 'horizon release %s\n' "sdk-$PIN" | cat - SHA256SUMS > message
          { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$KEY" | openssl base64 -d -A; } > key.der
          signed=
          while read -r line || [ -n "$line" ]; do
            printf '%s' "$line" | openssl base64 -d -A > signature
            openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey key.der -in message -sigfile signature > /dev/null 2>&1 && signed=1
          done < SHA256SUMS.sig
          [ -n "$signed" ] || { echo "SHA256SUMS is not signed by Sunrise" >&2; exit 1; }
          grep " $TOOL\$" SHA256SUMS | sha256sum -c -
          tar -xJf "$TOOL"
          install -Dm755 cargo-sunrise-mod "$HOME/.local/bin/cargo-sunrise-mod"
          cd "$GITHUB_WORKSPACE/mod"
          "$HOME/.local/bin/cargo-sunrise-mod" sunrise-mod check --uses > /dev/null
          test -f .sunrise/sdk/api/crates/sunrise-mod-api/Cargo.toml
      - name: Format (mod's own files)
        # mod/src/runtime/ is generated by tools/vendor.py (its `crate::` paths are rewritten, which
        # changes line lengths), so only the mod's own files are formatted; the vendored copy is
        # checked by `vendor.py --check` in the gates job.
        run: find mod/src -maxdepth 1 -name '*.rs' -print0 | xargs -0 rustfmt +stable --edition 2024 --check --config skip_children=true
      - name: Clippy (mod)
        run: cargo +stable clippy --manifest-path mod/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests (mod)
        run: cargo +stable test --manifest-path mod/Cargo.toml --lib

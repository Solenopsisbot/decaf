id = "horizon_java"
name = "Horizon Java"
version = "0.1.0"
description = "Runs Fabric and NeoForge Java mod jars on Horizon's native, JVM-free bytecode runtime."
authors = []
# The content API line this mod does not use; every manifest names it.
api = "0.2"
side = "both"
# M0/M1 register nothing, but the game's manifest parser requires exactly this list today: an
# empty `capabilities` is rejected with "a content mod has capabilities = [\"registries\"]"
# (sunrise-mod-package `Manifest::parse`), so a purely behavioural mod has no spelling yet.
# Candidate issue for the fork; game bindings and registries are later milestones here.
capabilities = ["registries"]

[native]
# The game and the exact Sunrise source revision this mod is built against
# (docs/modding/src/how-to/native-mods/005-native-mod-source-revisions.md).
# Only builds with a published SDK (release `sdk-<commit>`, the Nightlies) can be pinned:
# `cargo sunrise-mod update` moves the pin to the current Nightly.
# The launcher rebuilds the game at this commit. The runtime in `src/runtime/` is
# horizon-java's own, vendored by `tools/vendor.py` on the same commit.
game = "26.3"
sunrise = "3d34bbe63d71bb24c098c1e4021ef866be12fe2d"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
# The content packages `tools/bake.py` writes for a jar whose data component types this mod
# registers name it in `served_by`, so the game's namespace authority gives those namespaces to
# this mod (`Hooks::component_types`, and the jar's item parts). Sunrise accepts `served_by` only
# for a host that opts in here (sunrise-mod-package `dependencies::validate_served_by`).
serves_content = true
